<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetworkStats</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#141c2b',
              925: '#0c121e',
              950: '#070b12'
            }
          },
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0c121e;
    }
    ::-webkit-scrollbar-thumb {
      background: #293548;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b4c66;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden select-none">

  <!-- Top Navbar with View Switcher Tabs -->
  <header class="h-12 bg-slate-925 border-b border-slate-800/80 px-4 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-6">
      <div class="flex items-center space-x-2.5">
        <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12h4l3-9 4 18 3-9h4" />
        </svg>
        <span class="font-semibold text-sm tracking-tight text-white">NetworkStats</span>
      </div>

      <!-- Main View Tabs -->
      <nav class="flex items-center space-x-1 bg-slate-900/90 p-1 rounded-lg border border-slate-800/80">
        <button id="tabBtnLive" class="px-3 py-1 rounded-md text-xs font-medium bg-cyan-600 text-white transition">
          Live Monitor
        </button>
        <button id="tabBtnLossLog" class="px-3 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center space-x-1.5 transition">
          <span>Packet Loss Log</span>
          <span id="lossLogBadge" class="hidden px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-rose-500/20 text-rose-400 border border-rose-500/30">0</span>
        </button>
      </nav>
    </div>

    <button id="btnOpenAddModal" class="px-3 py-1.5 rounded-md bg-cyan-600 hover:bg-cyan-500 text-white font-medium text-xs flex items-center space-x-1.5 transition">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>Add Target</span>
    </button>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Left Sidebar: Target Switcher -->
    <aside class="w-64 bg-slate-925 border-r border-slate-800/80 flex flex-col shrink-0">
      <div class="px-3 py-2.5 border-b border-slate-800/80 flex items-center justify-between">
        <span class="text-[11px] font-medium uppercase tracking-wider text-slate-400">Targets</span>
        <span id="targetCountBadge" class="text-[11px] font-mono text-slate-500">0</span>
      </div>

      <div id="targetListContainer" class="flex-1 overflow-y-auto divide-y divide-slate-800/40">
        <!-- Populated by app.js -->
      </div>
    </aside>

    <!-- ================================================================== -->
    <!-- VIEW 1: LIVE MONITOR (Hop Table + Timeline Graph)                  -->
    <!-- ================================================================== -->
    <main id="viewLiveMonitor" class="flex-1 flex flex-col overflow-hidden bg-slate-950">

      <!-- Active Target Toolbar -->
      <div class="h-11 bg-slate-900/50 border-b border-slate-800/80 px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2.5 min-w-0">
          <div id="activeTargetBadge" class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></div>
          <span id="activeTargetLabel" class="font-medium text-sm text-white truncate">Select a target</span>
          <span id="activeTargetHost" class="font-mono text-xs text-slate-400 truncate"></span>
        </div>

        <div class="flex items-center space-x-2">
          <div class="hidden lg:flex items-center space-x-4 mr-2 text-xs font-mono text-slate-400">
            <div>Ping <span id="headerPingVal" class="text-slate-100 ml-1">--</span></div>
            <div>Jitter <span id="headerJitterVal" class="text-slate-100 ml-1">--</span></div>
            <div>Loss <span id="headerLossVal" class="text-slate-100 ml-1">--</span></div>
          </div>

          <!-- Adjustable Ping Interval Selector -->
          <div class="flex items-center space-x-1.5 bg-slate-900 border border-slate-800 rounded px-2 py-0.5">
            <span class="text-[11px] text-slate-400">Interval</span>
            <select id="selectTargetInterval" class="bg-transparent text-xs font-mono text-cyan-400 focus:outline-none cursor-pointer">
              <option value="0.5" class="bg-slate-900 text-slate-200">0.5s</option>
              <option value="1" class="bg-slate-900 text-slate-200" selected>1.0s</option>
              <option value="2" class="bg-slate-900 text-slate-200">2.0s</option>
              <option value="5" class="bg-slate-900 text-slate-200">5.0s</option>
              <option value="10" class="bg-slate-900 text-slate-200">10.0s</option>
            </select>
          </div>

          <button id="btnTogglePause" class="px-2.5 py-1 rounded bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 text-xs transition">
            <span id="btnTogglePauseText">Pause</span>
          </button>
          <button id="btnResetStats" class="px-2.5 py-1 rounded bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 text-xs transition">
            Reset
          </button>
          <button id="btnDeleteTarget" class="px-2.5 py-1 rounded bg-slate-900 hover:bg-rose-950/60 text-rose-400 border border-slate-800 hover:border-rose-800/60 text-xs transition">
            Delete
          </button>
        </div>
      </div>

      <!-- Upper Pane: Hop Table -->
      <section class="h-[46%] border-b border-slate-800/80 flex flex-col overflow-hidden">
        <div class="overflow-auto flex-1">
          <table class="w-full text-left border-collapse">
            <thead class="bg-slate-925 sticky top-0 z-10 border-b border-slate-800/80 text-[11px] font-medium text-slate-400">
              <tr>
                <th class="py-2 px-3 w-10 text-center">Plot</th>
                <th class="py-2 px-2 w-12">#</th>
                <th class="py-2 px-3">Host / IP</th>
                <th class="py-2 px-2 w-20 text-right">Loss %</th>
                <th class="py-2 px-2 w-16 text-right">Lost</th>
                <th class="py-2 px-2 w-16 text-right">Sent</th>
                <th class="py-2 px-2 w-20 text-right">Last</th>
                <th class="py-2 px-2 w-20 text-right">Avg</th>
                <th class="py-2 px-2 w-20 text-right">Best</th>
                <th class="py-2 px-2 w-20 text-right">Worst</th>
                <th class="py-2 px-2 w-20 text-right">Jitter</th>
                <th class="py-2 px-4 w-64">Latency</th>
              </tr>
            </thead>
            <tbody id="hopTableBody" class="divide-y divide-slate-800/40 text-xs font-mono">
              <!-- Populated by app.js -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Lower Pane: Timeline Chart -->
      <section class="flex-1 flex flex-col overflow-hidden bg-slate-925/30">
        <div class="h-9 px-4 border-b border-slate-800/80 flex items-center justify-between shrink-0 bg-slate-925">
          <div class="flex items-center space-x-2">
            <span class="text-xs font-medium text-slate-300">Timeline</span>
            <span id="plottedHopsSummary" class="text-[11px] font-mono text-slate-500"></span>
          </div>

          <div class="flex items-center space-x-1">
            <button data-window="300" class="time-window-btn px-2 py-0.5 rounded text-xs font-mono bg-cyan-600 text-white">5m</button>
            <button data-window="900" class="time-window-btn px-2 py-0.5 rounded text-xs font-mono text-slate-400 hover:text-slate-200">15m</button>
            <button data-window="3600" class="time-window-btn px-2 py-0.5 rounded text-xs font-mono text-slate-400 hover:text-slate-200">1h</button>
            <button data-window="21600" class="time-window-btn px-2 py-0.5 rounded text-xs font-mono text-slate-400 hover:text-slate-200">6h</button>
            <button data-window="86400" class="time-window-btn px-2 py-0.5 rounded text-xs font-mono text-slate-400 hover:text-slate-200">24h</button>
            <button id="btnResetZoom" class="ml-2 px-2 py-0.5 rounded text-xs font-mono text-slate-400 hover:text-slate-200 border border-slate-800">
              Reset Zoom
            </button>
          </div>
        </div>

        <div class="flex-1 relative p-3 overflow-hidden">
          <canvas id="timelineChart"></canvas>
        </div>
      </section>

    </main>

    <!-- ================================================================== -->
    <!-- VIEW 2: PACKET LOSS LOG (Chronological Outage & Spike History)     -->
    <!-- ================================================================== -->
    <main id="viewLossLog" class="hidden flex-1 flex-col overflow-hidden bg-slate-950">
      <div class="h-11 bg-slate-900/50 border-b border-slate-800/80 px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-4">
          <span class="font-medium text-sm text-white">Packet Loss History</span>
          <div class="flex items-center space-x-3 text-xs font-mono text-slate-400">
            <span>Incidents: <strong id="lossLogTotalIncidents" class="text-rose-400">0</strong></span>
            <span>Dropped Packets: <strong id="lossLogTotalPackets" class="text-rose-400">0</strong></span>
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <!-- Filter by Target -->
          <select id="selectLossTargetFilter" class="bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none">
            <option value="">All Targets</option>
          </select>

          <!-- Filter by Time Window -->
          <select id="selectLossWindowFilter" class="bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-xs font-mono text-slate-200 focus:outline-none">
            <option value="3600">Last 1h</option>
            <option value="21600">Last 6h</option>
            <option value="86400" selected>Last 24h</option>
            <option value="172800">Last 48h</option>
          </select>

          <button id="btnRefreshLossLog" class="px-2.5 py-1 rounded bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 text-xs transition">
            Refresh
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-925 sticky top-0 z-10 border-b border-slate-800/80 text-[11px] font-medium text-slate-400">
            <tr>
              <th class="py-2.5 px-4 w-44">Time</th>
              <th class="py-2.5 px-3 w-28">Ago</th>
              <th class="py-2.5 px-3 w-48">Target</th>
              <th class="py-2.5 px-3 w-48">Source / Root Cause</th>
              <th class="py-2.5 px-3 w-28 text-right">Lost</th>
              <th class="py-2.5 px-4">Affected Hops at Timestamp</th>
            </tr>
          </thead>
          <tbody id="lossLogTableBody" class="divide-y divide-slate-800/40 text-xs font-mono">
            <!-- Populated by app.js -->
          </tbody>
        </table>
      </div>
    </main>

  </div>

  <!-- Add Target Modal -->
  <div id="addTargetModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl w-full max-w-sm p-5">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-sm font-semibold text-white">Add Target</h3>
        <button id="btnCloseAddModal" class="text-slate-400 hover:text-white text-lg leading-none">&times;</button>
      </div>

      <form id="addTargetForm" class="mt-4 space-y-3.5">
        <div>
          <label class="block text-xs text-slate-400 mb-1">IP Address or Hostname</label>
          <input id="inputTargetHost" type="text" required placeholder="1.1.1.1 or example.com"
            class="w-full px-3 py-1.5 rounded-md bg-slate-950 border border-slate-800 text-sm text-white font-mono focus:outline-none focus:border-cyan-500" />
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Label (optional)</label>
          <input id="inputTargetLabel" type="text" placeholder="Cloudflare"
            class="w-full px-3 py-1.5 rounded-md bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-cyan-500" />
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Ping Interval (seconds)</label>
          <input id="inputTargetInterval" type="number" step="0.5" min="0.5" max="60" value="1.0"
            class="w-full px-3 py-1.5 rounded-md bg-slate-950 border border-slate-800 text-sm text-white font-mono focus:outline-none focus:border-cyan-500" />
        </div>

        <div id="addTargetError" class="hidden text-xs text-rose-400 bg-rose-950/50 border border-rose-800 rounded p-2"></div>

        <div class="flex items-center justify-end space-x-2 pt-2">
          <button type="button" id="btnCancelAddModal" class="px-3 py-1.5 rounded-md bg-slate-800 hover:bg-slate-700 text-xs text-slate-300">
            Cancel
          </button>
          <button type="submit" class="px-3 py-1.5 rounded-md bg-cyan-600 hover:bg-cyan-500 text-xs font-medium text-white">
            Add
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
